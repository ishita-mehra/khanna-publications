{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Khanna Notebooks — Customized Notebooks & Premium Printing{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Premium customized notebooks, magazines, business cards, posters & more. Free pan-India delivery. Wholesale available.{% endblock %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink:   { DEFAULT: '#141414', soft: '#2b2b2b', muted: '#6b6b6b' },
            cream: { DEFAULT: '#faf7f2', dark: '#f1e9dd', deep: '#e8ddcb' },
            gold:  { DEFAULT: '#c8961e', light: '#e8c56a', dark: '#9a7213' },
          },
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            soft: '0 4px 24px -6px rgba(20,20,20,.10)',
            lift: '0 24px 60px -20px rgba(20,20,20,.28)',
          },
        },
      },
    }
  </script>

  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block extra_css %}{% endblock %}
</head>

<body class="bg-cream text-ink font-sans antialiased selection:bg-gold selection:text-white overflow-x-hidden">

  {% include 'partials/navbar.html' %}

  <main>{% block content %}{% endblock %}</main>

  {% include 'partials/footer.html' %}

  <script src="{% static 'js/main.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
